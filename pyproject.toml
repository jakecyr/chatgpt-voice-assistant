[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-voice-assistant"
version = "2.1.0"
description = "Speak with OpenAI models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jake Cyr", email = "cyrjake@gmail.com"}]
dependencies = ["openai", "SpeechRecognition", "PyAudio", "gTTS"]

[project.scripts]
gptassist = "chatgpt_voice_assistant.main:main"

[dependency-groups]
dev = ["pytest", "mock", "coverage", "mypy", "types-pyaudio", "types-mock", "ruff"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
